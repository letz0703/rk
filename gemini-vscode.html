<!DOCTYPE html>
<html>
<head>
    <title>Gemini Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #1e1e1e; color: #d4d4d4; }
        .chat-container { max-width: 800px; margin: 0 auto; }
        .messages { height: 400px; overflow-y: auto; border: 1px solid #3c3c3c; padding: 15px; margin-bottom: 15px; background: #252526; border-radius: 8px; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 8px; }
        .user { background: #0e639c; margin-left: 50px; }
        .assistant { background: #2d2d30; margin-right: 50px; }
        .input-container { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #3c3c3c; background: #252526; color: #d4d4d4; border-radius: 4px; }
        button { padding: 12px 24px; background: #0e639c; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1177bb; }
        pre { background: #1e1e1e; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>🤖 Gemini Code Chat</h1>
        <div class="messages" id="messages"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="코딩 질문을 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script type="module">
        const API_KEY = 'AIzaSyCgU2ZPQmPV391XGXWWYn4x5DJnjYDWEHY';
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;

        let conversationHistory = [];

        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';

            try {
                conversationHistory.push({
                    role: "user",
                    parts: [{ text: message }]
                });

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: conversationHistory
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0]) {
                    const reply = data.candidates[0].content.parts[0].text;
                    addMessage('assistant', reply);

                    conversationHistory.push({
                        role: "model",
                        parts: [{ text: reply }]
                    });
                } else {
                    addMessage('assistant', 'Error: No response received');
                }
            } catch (error) {
                addMessage('assistant', `Error: ${error.message}`);
            }
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            // 코드 블록 처리
            const formattedContent = content
                .replace(/```(\w*)\n([\s\S]*?)\n```/g, '<pre><code class="language-$1">$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code style="background:#3c3c3c; padding:2px 4px; border-radius:2px;">$1</code>')
                .replace(/\n/g, '<br>');

            messageDiv.innerHTML = `<strong>${role === 'user' ? 'You' : 'Gemini'}:</strong><br>${formattedContent}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
